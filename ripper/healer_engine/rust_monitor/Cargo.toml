[package]
name = "rust_monitor"
version = "0.1.0"
edition = "2021"
description = "High-performance PTY tap, zero-copy ring buffer, and SIMD pattern scanner for Ripper self-healing"

[lib]
name = "rust_monitor"
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
